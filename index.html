<style>
/* The page works with no script and no outside files: fonts and pictures sit beside it.
   If a font fails to load, the phone's own Arabic font is used. */
@font-face{font-family:"Tajawal";font-weight:400;font-display:swap;src:url("fonts/Tajawal-Regular.ttf") format("truetype")}
@font-face{font-family:"Tajawal";font-weight:500;font-display:swap;src:url("fonts/Tajawal-Medium.ttf") format("truetype")}
@font-face{font-family:"Tajawal";font-weight:700;font-display:swap;src:url("fonts/Tajawal-Bold.ttf") format("truetype")}

*{-webkit-box-sizing:border-box;box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;background:#fff;color:#141210;
  font-family:"Tajawal",-apple-system,"SF Arabic","Segoe UI","Noto Sans Arabic","Noto Naskh Arabic",Tahoma,Arial,sans-serif;
  font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%;height:auto;border:0}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:rgba(0,0,0,.06)}

.page{max-width:480px;margin:0 auto;padding:28px 20px 36px}

/* brand */
.brand{text-align:center;padding:6px 0 26px}
.brand img{width:190px;margin:0 auto}
.brand p{
  margin:12px 0 0;direction:ltr;
  font-family:Georgia,"Times New Roman",serif;
  font-size:11px;letter-spacing:.42em;text-indent:.42em;color:#141210;
}

/* photos */
.photo{margin:0;border-radius:22px;overflow:hidden;background:#f3efea}
.photo img{width:100%}

/* product name */
.title{text-align:center;padding:30px 0 4px}
.title h1{margin:0;font-size:29px;line-height:1.35;font-weight:700}

/* the two small diamonds from the logo, used as a divider */
.rule{text-align:center;height:34px;line-height:34px;font-size:0}
.rule i{
  display:inline-block;vertical-align:middle;width:7px;height:7px;margin:0 3px;
  background:#a8642a;
  -webkit-transform:rotate(45deg);transform:rotate(45deg);
}
.rule:before,.rule:after{
  content:"";display:inline-block;vertical-align:middle;width:54px;height:1px;background:#e2d9cf;margin:0 10px;
}

/* calories */
.cal h2{margin:2px 0 14px;text-align:center;font-size:16px;font-weight:500;color:#6f665d}
.tiles{overflow:hidden;margin:0 -6px}
.tile{float:right;width:50%;padding:0 6px}
.tile div{background:#f8f4ee;border-radius:20px;padding:18px 10px 16px;text-align:center}
.tile b{display:block;font-size:17px;font-weight:700}
.tile strong{display:block;margin-top:4px;font-size:50px;line-height:1.05;font-weight:700;letter-spacing:-.01em;direction:ltr}
.tile span{display:block;font-size:14px;color:#6f665d}

.gap{height:26px}

/* links */
.links a{
  display:block;position:relative;margin-top:12px;
  padding:13px 68px 12px 44px;min-height:62px;
  border:1px solid #e2d9cf;border-radius:18px;background:#fff;
}
.links a:first-child{margin-top:0}
.links a:active{background:#f8f4ee}
.links svg{position:absolute;right:20px;top:50%;margin-top:-14px;width:28px;height:28px}
.links b{display:block;font-size:17px;font-weight:700;line-height:1.3}
.links span{display:block;direction:ltr;text-align:right;font-size:14px;color:#6f665d;line-height:1.4;
  font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.links a:after{
  content:"";position:absolute;left:22px;top:50%;margin-top:-5px;width:9px;height:9px;
  border-left:2px solid #b9aea2;border-bottom:2px solid #b9aea2;
  -webkit-transform:rotate(45deg);transform:rotate(45deg);
}

.foot{text-align:center;padding-top:30px;color:#9a9087;font-size:12px;direction:ltr;letter-spacing:.08em;
  font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}

/* gentle entrance; if a phone cannot animate, everything is simply there */
@-webkit-keyframes rise{from{opacity:0;-webkit-transform:translateY(10px)}to{opacity:1;-webkit-transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page>*{-webkit-animation:rise .6s ease both;animation:rise .6s ease both}
.page>*:nth-child(2){-webkit-animation-delay:.08s;animation-delay:.08s}
.page>*:nth-child(3){-webkit-animation-delay:.16s;animation-delay:.16s}
.page>*:nth-child(n+4){-webkit-animation-delay:.24s;animation-delay:.24s}
@media (prefers-reduced-motion:reduce){.page>*{-webkit-animation:none;animation:none}}

@media (max-width:340px){
  .title h1{font-size:25px}
  .tile strong{font-size:42px}
  .links a{padding-right:60px}
}
</style>
